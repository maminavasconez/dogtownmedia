<style>
  @keyframes bunnyBob { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-2px) scaleY(1.02); } }
  @keyframes bunnyHop { 0% { transform: translateY(0) scaleY(0.92); } 45% { transform: translateY(-14px) scaleY(1.06); } 100% { transform: translateY(0) scaleY(0.96); } }
  @keyframes carrotRise { 0% { opacity: 0; transform: translate(-50%,6px) scale(0.6) rotate(-8deg); } 25% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-52px) scale(1.05) rotate(10deg); } }
  @keyframes toastIn { 0% { opacity: 0; transform: translateY(6px); } 12% { opacity: 1; transform: translateY(0); } 82% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-4px); } }
  @keyframes carrotBurst { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.3) rotate(var(--r0)); } 14% { opacity: 1; transform: translate(-50%,-50%) scale(1.1) rotate(var(--r0)); } 70% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,calc(-50% + var(--dy))) scale(0.9) rotate(var(--r1)); } }
  @keyframes sheetFade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sheetIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  @keyframes dotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(198,255,51,0.7); } 50% { box-shadow: 0 0 0 6px rgba(198,255,51,0); } }

  .bunny-board-wrap { transform-origin: top left; }
  @media (max-width: 480px) {
    .bunny-card { padding: 18px !important; }
    .bunny-board-wrap { transform: scale(0.82); margin-bottom: -70px; }
  }
  @media (max-width: 400px) {
    .bunny-board-wrap { transform: scale(0.72); margin-bottom: -110px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bunny-board-wrap * { animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script>
// Cursor dot
document.addEventListener('mousemove', (e) => {
  const dot = document.querySelector('[data-cursor-dot]') || (() => {
    const d = document.createElement('div');
    d.setAttribute('data-cursor-dot', 'true');
    d.style.cssText = `
      position: fixed;
      width: 12px;
      height: 12px;
      background: var(--lime);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      box-shadow: 0 0 10px var(--lime), 0 0 20px rgba(198, 255, 51, 0.6);
      animation: pulse 1.5s ease-in-out infinite;
    `;
    document.body.appendChild(d);
    return d;
  })();
  dot.style.left = (e.clientX - 6) + 'px';
  dot.style.top = (e.clientY - 6) + 'px';
});
</script>
